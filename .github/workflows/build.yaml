name: Build

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Assemble debug
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # compare against the hand-written migrations in AppDatabase.kt
      - name: Print Room CREATE TABLE statements
        run: grep -rhoE 'CREATE TABLE IF NOT EXISTS `podcastEpisode(Chapter)?`[^"]*|CREATE INDEX IF NOT EXISTS `index_podcastEpisodeChapter[^"]*' app/build/generated/ksp/debug | sort -u

      # lint may flag pre-existing issues; keep the compile result separate
      - name: Lint debug
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
